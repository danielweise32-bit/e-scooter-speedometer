<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#070b12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>E-Scooter Speedometer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b12;color:#f7fbff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);background:radial-gradient(circle at 50% 45%,#14243a 0,#070b12 62%)}.speedline{display:flex;align-items:baseline;justify-content:center;gap:10px;white-space:nowrap}.speed{font-size:clamp(110px,32vw,230px);font-weight:650;line-height:.9;letter-spacing:-.085em;font-variant-numeric:tabular-nums}.unit{font-size:clamp(20px,5vw,30px);font-weight:600;color:#55d9ff}.gps{position:absolute;top:max(22px,env(safe-area-inset-top));left:50%;width:9px;height:9px;transform:translateX(-50%);border-radius:50%;background:#64748b}.gps.on{background:#52e0a0;box-shadow:0 0 15px #52e0a0}.start{position:absolute;bottom:max(25px,env(safe-area-inset-bottom));border:1px solid #ffffff20;border-radius:30px;background:#ffffff0d;color:#aebbd0;padding:12px 20px;font-weight:600}.menuBtn{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;width:46px;height:46px;border:1px solid #ffffff20;border-radius:14px;background:#ffffff0d;color:white;font-size:25px;z-index:5}.shade{position:fixed;inset:0;background:#0009;z-index:8;opacity:0;pointer-events:none}.drawer{position:fixed;z-index:9;top:0;bottom:0;left:0;width:min(360px,88vw);padding:calc(env(safe-area-inset-top) + 22px) 22px calc(env(safe-area-inset-bottom) + 22px);background:#101b2b;transform:translateX(-105%);transition:transform .25s;overflow:auto}.drawer.open{transform:translateX(0)}.shade.open{opacity:1;pointer-events:auto}.drawerHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.drawer h2{font-size:20px}.close{background:none;border:0;color:#aebbd0;font-size:28px}.field{display:block;color:#9eafc7;font-size:12px;margin:18px 0 7px}input{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff20;background:#091321;color:white}.action{width:100%;margin-top:14px;padding:14px;border:0;border-radius:13px;background:#55d9ff;color:#07121e;font-weight:700}.secondary{background:#ffffff12;color:#eaf4ff}.status,.note{font-size:13px;line-height:1.5;color:#aebbd0;margin-top:15px}.note{font-size:12px;color:#7f91aa}@media(orientation:landscape){.screen{padding:12px 70px}.speed{font-size:clamp(100px,25vw,210px)}.gps{top:16px}.start{bottom:12px}.menuBtn{top:12px;left:12px}}
</style></head><body>
<main class="screen"><button class="menuBtn" id="menuBtn" aria-label="Meniu">☰</button><div class="gps" id="gpsDot"></div><div class="speedline"><span class="speed" id="speed">0</span><span class="unit">km/h</span></div><button class="start" id="startBtn">Pornește GPS</button></main>
<div class="shade" id="shade"></div><aside class="drawer" id="drawer"><div class="drawerHead"><h2>Setări trotinetă</h2><button class="close" id="closeBtn">×</button></div><label class="field" for="scooterName">Numele trotinetei</label><input id="scooterName" placeholder="Ex. Trotineta mea"><label class="field" for="scooterModel">Model</label><input id="scooterModel" placeholder="Ex. KuKirin G2 Master"><button class="action" id="saveBtn">Salvează trotineta</button><button class="action secondary" id="connectBtn">Conectare Bluetooth</button><div class="status" id="btStatus">Nicio trotinetă conectată.</div><p class="note">Viteza este calculată prin GPS. Citirea voltajului și bateriei necesită protocolul Bluetooth al modelului. Safari pe iPhone nu suportă Web Bluetooth.</p></aside>
<script>
(()=>{const speedEl=document.getElementById('speed'),dot=document.getElementById('gpsDot'),btn=document.getElementById('startBtn'),drawer=document.getElementById('drawer'),shade=document.getElementById('shade'),status=document.getElementById('btStatus');let watch=null,smoothed=0;function menu(v){drawer.classList.toggle('open',v);shade.classList.toggle('open',v)}document.getElementById('menuBtn').onclick=()=>menu(true);document.getElementById('closeBtn').onclick=()=>menu(false);shade.onclick=()=>menu(false);function stop(){if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;dot.classList.remove('on');btn.textContent='Pornește GPS'}function start(){if(!navigator.geolocation){btn.textContent='GPS indisponibil';return}if(watch!==null){stop();return}btn.textContent='Oprește GPS';watch=navigator.geolocation.watchPosition(p=>{dot.classList.add('on');let v=p.coords.speed>=0?p.coords.speed*3.6:0;if(v<1.2)v=0;smoothed=smoothed*.55+v*.45;speedEl.textContent=Math.round(smoothed)},e=>{stop();btn.textContent=e.code===1?'Permite accesul GPS':'Încearcă din nou'},{enableHighAccuracy:true,maximumAge:500,timeout:20000})}btn.onclick=start;document.getElementById('saveBtn').onclick=()=>{let n=document.getElementById('scooterName').value.trim(),m=document.getElementById('scooterModel').value.trim();status.textContent=n||m?'Trotinetă salvată: '+(n||'Fără nume')+(m?' · '+m:'')+'.':'Introdu un nume sau un model.'};document.getElementById('connectBtn').onclick=()=>{status.textContent='Pe iPhone, Safari nu oferă Web Bluetooth. Pentru conectare reală și citirea voltajului trebuie identificat protocolul trotinetei și folosită o punte compatibilă.'}})();
</script></body></html>
